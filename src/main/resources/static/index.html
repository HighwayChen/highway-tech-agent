<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway</title>
    <link rel="stylesheet" href="vs2015.min.css">
    <script src="marked.min.js"></script>
    <script src="highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: #f7f7f8; color: #1a1a1a; overflow: hidden; }
        button, input, textarea { font-family: inherit; }
        button { border: none; }

        .app-shell { height: 100vh; display: grid; grid-template-columns: 260px 1fr; }

        /* Sidebar */
        .sidebar { background: #1c1c1c; color: #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px 16px 16px; }
        .brand-name { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
        .new-chat-btn { width: 100%; margin-top: 14px; padding: 10px 14px; border: 1px solid #3a3a3a; background: transparent; color: #e0e0e0; border-radius: 10px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s; }
        .new-chat-btn:hover { background: #2a2a2a; border-color: #4a4a4a; }
        .sidebar-label { padding: 14px 18px 6px; font-size: 11px; color: #777; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .conversation-list { flex: 1; overflow-y: auto; padding: 4px 8px 14px; }
        .conversation-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; color: #b0b0b0; transition: background 0.1s; }
        .conversation-item:hover { background: #2a2a2a; color: #e0e0e0; }
        .conversation-item.active { background: #333; color: #fff; }
        .conv-info { flex: 1; min-width: 0; }
        .conv-summary { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .delete-btn { display: none; background: none; color: #666; cursor: pointer; font-size: 15px; margin-left: 8px; flex-shrink: 0; }
        .conversation-item:hover .delete-btn { display: block; }

        /* Main area */
        .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; }

        /* Empty state */
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; }
        .empty-state .brand { font-size: 28px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
        .empty-state .brand-sub { font-size: 14px; color: #999; margin-bottom: 32px; }
        .center-input-box { width: 100%; max-width: 680px; }

        /* Chat area */
        .chat-area { flex: 1; min-height: 0; display: none; flex-direction: column; }
        .chat-area.active { display: flex; }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px 0; background: #fff; }
        .chat-inner { max-width: 720px; margin: 0 auto; padding: 0 24px; }

        /* Messages */
        .message { margin-bottom: 24px; display: flex; gap: 12px; align-items: flex-start; }
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        .msg-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .message.assistant .msg-avatar { background: #5b5fc7; color: #fff; }
        .message-bubble { line-height: 1.7; font-size: 15px; max-width: 100%; }
        .message.user .message-bubble { background: #eef0ff; color: #1a1a1a; padding: 10px 16px; border-radius: 16px; border-bottom-right-radius: 4px; white-space: pre-wrap; max-width: 70%; font-size: 14px; }

        /* Input */
        .input-section { padding: 0 24px 24px; flex-shrink: 0; }
        .input-box-wrap { max-width: 720px; margin: 0 auto; }
        .input-box { display: flex; align-items: flex-end; gap: 8px; background: #f7f7f8; border: 1px solid #e0e0e0; border-radius: 14px; padding: 10px 12px 10px 16px; transition: border-color 0.2s, box-shadow 0.2s; }
        .input-box:focus-within { border-color: #5b5fc7; box-shadow: 0 0 0 3px rgba(91,95,199,0.1); }
        .chat-input { flex: 1; padding: 4px 0; border: none; background: transparent; font-size: 15px; outline: none; resize: none; color: #1a1a1a; min-height: 24px; max-height: 120px; line-height: 1.5; }
        .chat-input::placeholder { color: #aaa; }
        .send-btn, .stop-btn { width: 34px; height: 34px; color: #fff; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn { background: #5b5fc7; font-size: 14px; }
        .send-btn:hover { background: #4a4eb8; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        .stop-btn { background: #ef4444; font-size: 12px; display: none; }

        /* Markdown */
        .markdown-body { line-height: 1.75; word-wrap: break-word; color: #1a1a1a; }
        .markdown-body p { margin: 0 0 10px; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { margin: 16px 0 8px; font-weight: 700; color: #1a1a1a; }
        .markdown-body h2 { font-size: 1.15em; }
        .markdown-body h3 { font-size: 1.05em; }
        .markdown-body ul, .markdown-body ol { margin: 0 0 10px; padding-left: 22px; }
        .markdown-body li { margin: 4px 0; }
        .markdown-body blockquote { margin: 0 0 10px; padding: 8px 14px; border-left: 3px solid #ddd; color: #555; background: #fafafa; border-radius: 4px; }
        .markdown-body code { background: #f3f4f6; padding: 2px 5px; border-radius: 4px; font-size: 0.87em; font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; color: #c026d3; }
        .markdown-body pre { margin: 0 0 10px; padding: 14px; background: #1e1e1e; border-radius: 10px; overflow-x: auto; }
        .markdown-body pre code { background: none; padding: 0; color: #d4d4d4; }
        .markdown-body table { border-collapse: collapse; margin: 0 0 10px; width: 100%; font-size: 14px; }
        .markdown-body th, .markdown-body td { border: 1px solid #e0e0e0; padding: 7px 12px; text-align: left; }
        .markdown-body th { background: #f9fafb; font-weight: 700; }
        .markdown-body a { color: #5b5fc7; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }

        /* References */
        .references { margin-top: 12px; padding: 10px 14px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        .references-header { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 3px 0; user-select: none; }
        .references-header .arrow, .thinking-toggle .arrow { display: inline-block; transition: transform 0.15s; font-size: 8px; color: #999; }
        .references-header .arrow.open, .thinking-toggle .arrow.open { transform: rotate(90deg); }
        .references-header h4 { font-size: 12px; color: #888; margin: 0; font-weight: 600; }
        .references-header .count { font-size: 11px; color: #aaa; }
        .reference-list { display: none; margin-top: 4px; }
        .reference-list.open { display: block; }
        .reference-item { font-size: 13px; color: #5b5fc7; margin: 3px 0; }

        /* Suggestions */
        .suggested { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
        .suggested-tag, .regen-btn { padding: 7px 14px; background: #f7f7f8; border: 1px solid #e0e0e0; border-radius: 16px; font-size: 13px; color: #555; cursor: pointer; transition: 0.15s; }
        .suggested-tag:hover, .regen-btn:hover { background: #eef0ff; color: #1a1a1a; border-color: #5b5fc7; }

        /* Thinking */
        .thinking-container { margin-bottom: 12px; }
        .thinking-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 8px; color: #888; font-size: 13px; user-select: none; border-radius: 6px; transition: background 0.1s; }
        .thinking-toggle:hover { background: #f5f5f5; }
        .thinking-steps { display: none; margin-top: 4px; padding-left: 14px; }
        .thinking-steps.open { display: block; }
        .thinking-step { margin-bottom: 6px; font-size: 13px; line-height: 1.6; color: #555; }
        .step-label { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 5px; vertical-align: top; }
        .thought-label { background: #fef3c7; color: #92400e; }
        .action-label { background: #dbeafe; color: #1e40af; }
        .observation-label { background: #d1fae5; color: #065f46; }
        .observation-content { display: block; margin-top: 3px; padding: 6px 10px; background: #fafafa; border-radius: 5px; border: 1px solid #eee; max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #555; }

        /* Typing indicator */
        .typing-indicator { color: #999; font-size: 14px; }
        .typing-indicator::before { content: '思考中'; }
        .typing-indicator::after { content: ''; display: inline-block; width: 4px; height: 4px; background: #999; border-radius: 50%; animation: pulse 1.2s infinite; margin-left: 4px; vertical-align: middle; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-name">Highway</div>
            <button class="new-chat-btn" onclick="newChat()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                新建对话
            </button>
        </div>
        <div class="sidebar-label">对话历史</div>
        <div class="conversation-list" id="conversationList"></div>
    </aside>

    <main class="chat-main">
        <div class="empty-state" id="emptyState">
            <div class="brand">Highway</div>
            <div class="brand-sub">有什么想问的，尽管说</div>
            <div class="center-input-box">
                <div class="input-box" id="emptyInputBox">
                    <textarea class="chat-input" id="emptyChatInput" rows="1" placeholder="输入你的问题..." onkeydown="handleInputKey(event, 'empty')"></textarea>
                    <button class="send-btn" id="emptySendBtn" onclick="sendFromEmpty()">&#10148;</button>
                </div>
            </div>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="chat-container" id="chatContainer">
                <div class="chat-inner" id="chatInner"></div>
            </div>
            <div class="input-section">
                <div class="input-box-wrap">
                    <div class="input-box" id="mainInputBox">
                        <textarea class="chat-input" id="mainChatInput" rows="1" placeholder="输入你的问题..." onkeydown="handleInputKey(event, 'main')"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendFromMain()">&#10148;</button>
                        <button class="stop-btn" id="stopBtn" onclick="stopStream()">&#9632;</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    marked.setOptions({
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
            return hljs.highlightAuto(code).value;
        },
        breaks: true
    });

    let conversationId = null;
    let isStreaming = false;
    let currentEventSource = null;
    let hasMessages = false;

    const CONV_STORAGE_KEY = 'highway.conversationId';
    const CONV_TTL_MS = 30 * 60 * 1000;

    function saveConversationId(id) {
        if (!id) { localStorage.removeItem(CONV_STORAGE_KEY); return; }
        localStorage.setItem(CONV_STORAGE_KEY, JSON.stringify({ id: id, expireAt: Date.now() + CONV_TTL_MS }));
    }

    function loadStoredConversationId() {
        try {
            var raw = localStorage.getItem(CONV_STORAGE_KEY);
            if (!raw) return null;
            var obj = JSON.parse(raw);
            if (!obj || !obj.id || !obj.expireAt || obj.expireAt < Date.now()) {
                localStorage.removeItem(CONV_STORAGE_KEY);
                return null;
            }
            return obj.id;
        } catch (e) { return null; }
    }

    function touchConversationId() {
        if (conversationId) saveConversationId(conversationId);
    }

    function showEmpty() {
        hasMessages = false;
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('chatArea').classList.remove('active');
    }

    function showChat() {
        hasMessages = true;
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('chatArea').classList.add('active');
    }

    function newChat() {
        conversationId = null;
        saveConversationId(null);
        document.getElementById('chatInner').innerHTML = '';
        showEmpty();
        loadConversations();
    }

    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    document.getElementById('emptyChatInput').addEventListener('input', function() { autoGrow(this); });
    document.getElementById('mainChatInput').addEventListener('input', function() { autoGrow(this); });

    function handleInputKey(e, from) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (from === 'empty') sendFromEmpty(); else sendFromMain();
        }
    }

    async function loadConversations() {
        try {
            var res = await fetch('/api/conversations');
            var data = await res.json();
            var list = document.getElementById('conversationList');
            list.innerHTML = data.map(function(item) {
                var summary = escapeHtml(item.summary || '新对话');
                return '<div class="conversation-item ' + (item.id === conversationId ? 'active' : '') + '" onclick="switchConversation(\'' + escapeAttribute(item.id) + '\')">' +
                    '<div class="conv-info"><span class="conv-summary">' + summary + '</span></div>' +
                    '<button class="delete-btn" onclick="event.stopPropagation();deleteConversation(\'' + escapeAttribute(item.id) + '\')">&times;</button>' +
                '</div>';
            }).join('');
        } catch (e) { console.error(e); }
    }

    async function switchConversation(id) {
        conversationId = id;
        saveConversationId(id);
        loadConversations();
        var inner = document.getElementById('chatInner');
        inner.innerHTML = '<div style="text-align:center;padding:40px;color:#999;font-size:14px;">加载中...</div>';
        showChat();
        try {
            var res = await fetch('/api/conversations/' + encodeURIComponent(id) + '/messages');
            var messages = await res.json();
            inner.innerHTML = '';
            var lastUserMsg = null;
            messages.forEach(function(msg) {
                if (msg.role === 'user') {
                    addBubble('user', msg.content);
                    lastUserMsg = msg.content;
                } else {
                    var clean = stripSuggestions(msg.content);
                    addAssistantBubble(renderMarkdown(clean));
                    lastUserMsg = null;
                }
            });
            if (lastUserMsg) {
                var regenDiv = document.createElement('div');
                regenDiv.className = 'message assistant';
                regenDiv.innerHTML = '<div class="msg-avatar">H</div>' +
                    '<div class="message-bubble">' +
                        '<button class="regen-btn" onclick="regenerate(this, decodeInlineText(\'' + encodeInlineText(lastUserMsg) + '\'))">&#8635; 重新生成</button>' +
                    '</div>';
                inner.appendChild(regenDiv);
            }
            scrollBottom();
        } catch (e) { inner.innerHTML = ''; }
    }

    async function deleteConversation(id) {
        await fetch('/api/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
        if (conversationId === id) newChat(); else loadConversations();
    }

    function addBubble(role, content) {
        var inner = document.getElementById('chatInner');
        var div = document.createElement('div');
        div.className = 'message ' + role;
        if (role === 'user') {
            div.innerHTML = '<div class="message-bubble">' + escapeHtml(content) + '</div>';
        } else {
            div.innerHTML = '<div class="msg-avatar">H</div><div class="message-bubble"><div class="markdown-body">' + renderMarkdown(content) + '</div></div>';
        }
        inner.appendChild(div);
        scrollBottom();
        return div;
    }

    function addAssistantBubble(content) {
        var inner = document.getElementById('chatInner');
        var div = document.createElement('div');
        div.className = 'message assistant';
        div.innerHTML =
            '<div class="msg-avatar">H</div>' +
            '<div class="message-bubble">' +
                '<div class="thinking-container" style="display:none">' +
                    '<div class="thinking-toggle" onclick="toggleThinking(this)">' +
                        '<span class="arrow">&#9654;</span> 思考过程' +
                    '</div>' +
                    '<div class="thinking-steps"></div>' +
                '</div>' +
                '<div class="answer-content markdown-body typing-indicator"></div>' +
                '<div class="references-content"></div>' +
                '<div class="suggested-content"></div>' +
            '</div>';
        inner.appendChild(div);
        if (content) {
            div.querySelector('.answer-content').classList.remove('typing-indicator');
            div.querySelector('.answer-content').innerHTML = content;
        }
        scrollBottom();
        return div;
    }

    function toggleThinking(el) {
        var steps = el.nextElementSibling;
        var arrow = el.querySelector('.arrow');
        steps.classList.toggle('open');
        arrow.classList.toggle('open');
    }

    function scrollBottom() {
        var c = document.getElementById('chatContainer');
        c.scrollTop = c.scrollHeight;
    }

    function escapeHtml(text) {
        var d = document.createElement('div');
        d.textContent = text == null ? '' : String(text);
        return d.innerHTML;
    }

    function stripSuggestions(text) {
        if (!text) return text;
        var idx = text.indexOf('---suggestions---');
        if (idx >= 0) return text.substring(0, idx).trimEnd();
        return text;
    }

    function escapeAttribute(text) {
        return escapeHtml(text).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    function safeUrl(url) {
        try {
            var parsed = new URL(url, window.location.origin);
            if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
        } catch (e) {}
        return '#';
    }

    function encodeInlineText(text) {
        return encodeURIComponent(text == null ? '' : String(text));
    }

    function decodeInlineText(text) {
        return decodeURIComponent(text);
    }

    function renderMarkdown(text) {
        if (typeof marked !== 'undefined' && marked.parse) {
            try { return marked.parse(text || ''); } catch(e) {}
        }
        return '<div style="white-space:pre-wrap;word-break:break-word;">' + escapeHtml(text) + '</div>';
    }

    function sendFromEmpty() {
        var input = document.getElementById('emptyChatInput');
        var msg = input.value.trim();
        if (!msg || isStreaming) return;
        input.value = '';
        input.style.height = 'auto';
        showChat();
        doSend(msg);
    }

    function sendFromMain() {
        var input = document.getElementById('mainChatInput');
        var msg = input.value.trim();
        if (!msg || isStreaming) return;
        input.value = '';
        input.style.height = 'auto';
        doSend(msg);
    }

    function regenerate(btn, message) {
        var bubble = btn.closest('.message');
        if (bubble) bubble.remove();
        isStreaming = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('stopBtn').style.display = 'flex';
        startChat(message, true);
    }

    function doSend(message) {
        touchConversationId();
        isStreaming = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('stopBtn').style.display = 'flex';
        addBubble('user', message);
        startChat(message);
    }

    function startChat(message, skipSaveUser) {
        var div = addAssistantBubble('');
        var answerEl = div.querySelector('.answer-content');
        var refsEl = div.querySelector('.references-content');
        var sugEl = div.querySelector('.suggested-content');
        var thinkContainer = div.querySelector('.thinking-container');
        var thinkSteps = div.querySelector('.thinking-steps');
        var answerText = '';
        var url = '/api/chat?message=' + encodeURIComponent(message) +
            (conversationId ? '&conversationId=' + encodeURIComponent(conversationId) : '') +
            (skipSaveUser ? '&skipSaveUser=true' : '');
        var es = new EventSource(url);
        currentEventSource = es;

        es.onmessage = function(e) {
            var d = JSON.parse(e.data);
            switch (d.type) {
                case 'token':
                    answerEl.classList.remove('typing-indicator');
                    answerText += d.content;
                    answerEl.innerHTML = renderMarkdown(stripSuggestions(answerText));
                    scrollBottom();
                    break;
                case 'references':
                    renderRefs(refsEl, d.data);
                    break;
                case 'answer':
                    answerText = stripSuggestions(d.content);
                    answerEl.innerHTML = renderMarkdown(answerText);
                    break;
                case 'suggested':
                    renderSuggested(sugEl, d.data);
                    break;
                case 'conversation':
                    conversationId = d.id;
                    saveConversationId(conversationId);
                    loadConversations();
                    break;
                case 'error':
                    answerEl.classList.remove('typing-indicator');
                    answerEl.textContent = d.message || '出错了';
                    break;
                case 'done':
                    finishStream(es);
                    break;
            }
        };
        es.onerror = function() {
            es.close();
            currentEventSource = null;
            answerEl.classList.remove('typing-indicator');
            if (!answerText) answerEl.textContent = '连接错误';
            resetUI();
        };
    }

    function addThinkStep(container, type, content) {
        var labels = { thought: '思考', action: '搜索', observation: '结果' };
        var div = document.createElement('div');
        div.className = 'thinking-step';
        if (type === 'observation') {
            div.innerHTML = '<span class="step-label ' + type + '-label">' + labels[type] + '</span><div class="step-content observation-content">' + escapeHtml(content) + '</div>';
        } else {
            div.innerHTML = '<span class="step-label ' + type + '-label">' + labels[type] + '</span><span class="step-content">' + escapeHtml(content) + '</span>';
        }
        container.appendChild(div);
    }

    function renderRefs(el, refs) {
        el.innerHTML = '<div class="references">' +
            '<div class="references-header" onclick="toggleReferences(this)">' +
                '<span class="arrow">&#9654;</span>' +
                '<h4>参考来源</h4>' +
                '<span class="count">(' + refs.length + ')</span>' +
            '</div>' +
            '<div class="reference-list">' +
                refs.map(function(r) { return '<div class="reference-item">[' + escapeHtml(r.id) + '] <a href="' + escapeAttribute(safeUrl(r.url)) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(r.title) + '</a></div>'; }).join('') +
            '</div>' +
        '</div>';
    }

    function toggleReferences(el) {
        var list = el.nextElementSibling;
        var arrow = el.querySelector('.arrow');
        list.classList.toggle('open');
        arrow.classList.toggle('open');
    }

    function renderSuggested(el, qs) {
        el.innerHTML = '<div class="suggested">' + qs.map(function(q) { return '<span class="suggested-tag" onclick="askSuggested(this)">' + escapeHtml(q) + '</span>'; }).join('') + '</div>';
    }

    function finishStream(es) {
        es.close();
        currentEventSource = null;
        resetUI();
    }

    function resetUI() {
        isStreaming = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('stopBtn').style.display = 'none';
    }

    function stopStream() {
        if (currentEventSource) {
            currentEventSource.close();
            currentEventSource = null;
        }
        if (conversationId) fetch('/api/chat/stop?conversationId=' + encodeURIComponent(conversationId), { method: 'POST' }).catch(function(){});
        resetUI();
    }

    function askSuggested(el) {
        document.getElementById('mainChatInput').value = el.textContent;
        sendFromMain();
    }

    (async function bootstrap() {
        var stored = loadStoredConversationId();
        if (stored) {
            try {
                var res = await fetch('/api/conversations/' + encodeURIComponent(stored) + '/messages');
                if (res.ok) {
                    var messages = await res.json();
                    if (messages && messages.length > 0) {
                        await switchConversation(stored);
                        return;
                    }
                }
            } catch (e) { /* fall through to fresh chat */ }
            saveConversationId(null);
        }
        loadConversations();
    })();
</script>
</body>
</html>
